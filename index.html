
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 봉담중 2학년 9반 청소당번 뽑기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }

        .info p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .draw-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            margin-bottom: 30px;
        }

        .draw-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.6);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
        }

        .result-title {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .selected-numbers {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .number-card {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .congratulations {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #c3e6cb;
            font-weight: bold;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }

        .drawing {
            color: #667eea;
            font-size: 1.2em;
            margin: 20px 0;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .number-card {
                width: 50px;
                height: 50px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 봉담중 2학년 9반 청소당번 뽑기</h1>
        
        <div class="info">
            <p><strong>총 학생 수:</strong> 31명 (1번 ~ 31번)</p>
            <p><strong>선발 인원:</strong> 6명</p>
        </div>

        <button class="draw-button" onclick="drawCleaningDuty()">
            청소당번 뽑기! 🎲
        </button>

        <div id="drawing-message" class="drawing hidden">
            당번을 뽑는 중...
        </div>

        <div id="results" class="results hidden">
            <div class="result-title">🎉 이번 주 청소당번 🎉</div>
            <div id="selected-numbers" class="selected-numbers"></div>
            <div class="congratulations">
                선택된 학생들은 열심히 청소해주세요! 💪
            </div>
        </div>
    </div>

    <script>
        function drawCleaningDuty() {
            const drawButton = document.querySelector('.draw-button');
            const drawingMessage = document.getElementById('drawing-message');
            const results = document.getElementById('results');
            const selectedNumbersContainer = document.getElementById('selected-numbers');

            // 버튼 비활성화 및 메시지 표시
            drawButton.disabled = true;
            drawButton.textContent = '뽑는 중...';
            drawingMessage.classList.remove('hidden');
            results.classList.add('hidden');

            // 애니메이션 효과를 위한 딜레이
            setTimeout(() => {
                // 1부터 31까지의 숫자 배열 생성
                const students = [];
                for (let i = 1; i <= 31; i++) {
                    students.push(i);
                }

                // Fisher-Yates 셔플 알고리즘으로 배열 섞기
                for (let i = students.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [students[i], students[j]] = [students[j], students[i]];
                }

                // 처음 6명 선택
                const selectedStudents = students.slice(0, 6).sort((a, b) => a - b);

                // 결과 화면 업데이트
                selectedNumbersContainer.innerHTML = '';
                selectedStudents.forEach((number, index) => {
                    setTimeout(() => {
                        const numberCard = document.createElement('div');
                        numberCard.className = 'number-card';
                        numberCard.textContent = number + '번';
                        selectedNumbersContainer.appendChild(numberCard);
                    }, index * 200);
                });

                // 결과 표시
                setTimeout(() => {
                    drawingMessage.classList.add('hidden');
                    results.classList.remove('hidden');
                    
                    // 버튼 원래 상태로 복원
                    drawButton.disabled = false;
                    drawButton.textContent = '다시 뽑기! 🎲';
                }, 1200);

            }, 1500);
        }

        // 페이지 로드 시 환영 메시지
        window.addEventListener('load', () => {
            console.log('학급 청소당번 뽑기 앱이 준비되었습니다!');
        });
    </script>
</body>
</html>
